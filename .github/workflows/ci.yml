name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - run: npm run check

    # The gallery's E2E specs in the runner's installed Google Chrome, headed under xvfb and
    # headless (tests/e2e/README.md).
    e2e:
        name: e2e (${{ matrix.mode }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - mode: headed
                      headless: "0"
                    - mode: headless
                      headless: "1"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Install xvfb
              if: matrix.headless == '0'
              run: sudo apt-get update && sudo apt-get install -y xvfb xauth
            - name: End-to-end tests
              env:
                  E2E_HEADLESS: ${{ matrix.headless }}
              run: |
                  if [ "$E2E_HEADLESS" = "0" ]; then
                      xvfb-run -a -s "-screen 0 2560x1440x24" npx playwright test --pass-with-no-tests
                  else
                      npx playwright test --pass-with-no-tests
                  fi
            - name: Upload end-to-end artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-results-${{ matrix.mode }}
                  path: test-results
                  if-no-files-found: ignore

    # The Node benchmarks, one at a time, report-only (docs/SPEC.md §2, tests/perf/README.md):
    # the job prints their numbers and never fails the workflow.
    perf:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Benchmarks (report-only)
              run: |
                  for file in tests/perf/*.perf.ts; do
                      name="$(basename "$file" .perf.ts)"
                      npm run perf -- "$name" || echo "::warning::Benchmark $name did not finish."
                  done
